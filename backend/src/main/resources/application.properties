# backend/src/main/resources/application.properties

server.port=8080
python.path=python
project.root=/home/atharva/Desktop/game-analytics-platform

# Set to true (recommended) so Python scripts run without OpenCV windows.
# Set to false only if running on a desktop with a display and you want to
# see the game windows directly. On a headless server this MUST be true.
game.headless=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always